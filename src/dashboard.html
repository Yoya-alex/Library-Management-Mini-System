<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library Management - Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      header {
        background: #4caf50;
        color: white;
        padding: 15px;
        text-align: center;
      }
      nav {
        background: #333;
        color: white;
        padding: 10px;
      }
      nav a {
        color: white;
        margin: 0 15px;
        text-decoration: none;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <header>
      <h2>Librarian Dashboard</h2>
    </header>

    <nav>
      <a href="#">Dashboard</a>
      <a href="#">Add Book</a>
      <a href="#">Logout</a>
    </nav>

    <main>
      <h3>Book Inventory</h3>
      <table id="bookTable">
        <thead>
          <tr>
            <th>Book ID</th>
            <th>Title</th>
            <th>Author</th>
          </tr>
        </thead>
        <tbody>
          <!-- Book rows will be added here dynamically -->
        </tbody>
      </table>
    </main>

    <script src="app.js"></script>
  </body>
</html>
